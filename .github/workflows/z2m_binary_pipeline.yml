name: ⚡ Z2M Binary Bundle CI/CD Pipeline

on:
  schedule:
    # 每周一 UTC 02:00 (北京时间 10:00) 自动同步上游 Z2M 仓库最新设备库
    - cron: "0 2 * * 1"
  push:
    branches: [ main, master ]
    paths:
      - "tools/**"
      - "data/converters/**"
      - ".github/workflows/z2m_binary_pipeline.yml"
  workflow_dispatch: # 支持在 GitHub 网页一键手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release-binary-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出当前仓库
        uses: actions/checkout@v4

      - name: 🟢 配置 Node.js 22 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🐍 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 获取最新官方 zigbee-herdsman-converters
        run: |
          npm install zigbee-herdsman-converters@latest
          ZHC_VER=$(node -p "require('zigbee-herdsman-converters/package.json').version")
          echo "ZHC_VERSION=${ZHC_VER}" >> $GITHUB_ENV
          echo "Upstream zigbee-herdsman-converters version: ${ZHC_VER}"

      - name: ⚙️ 阶段一：提取 Z2M 声明式中间元数据 (IR)
        run: |
          mkdir -p build_ir dist
          # 运行抽取脚本，支持内置自定义转换器合并
          node tools/z2m_bundle_generator.mjs build_ir
          # 拷贝本地私有转换器至中间目录
          if [ -d "data/converters" ]; then
            mkdir -p build_ir/converters
            cp -r data/converters/* build_ir/converters/ || true
          fi

      - name: 🔨 阶段二：离线编译为定长索引 Zero-RAM Binary Bundle
        run: |
          python3 tools/z2m_binary_compiler.py build_ir dist/z2m_bundle.bin dist/z2m_manifest.json

      - name: 🧪 阶段三：自动化二分查找检索与校验套件 (Verification Suite)
        run: |
          python3 - << 'EOF'
          import os
          import struct
          import hashlib

          def fnv1a_32(text: str) -> int:
              h = 0x811C9DC5
              for b in text.lower().strip().encode("utf-8"):
                  h ^= b
                  h = (h * 0x01000193) & 0xFFFFFFFF
              return h

          bin_path = "dist/z2m_bundle.bin"
          assert os.path.exists(bin_path), "Bundle binary missing!"

          with open(bin_path, "rb") as f:
              header = f.read(64)
              magic, ver, dev_count, idx_off, data_off, str_off, total_sz, sha256_raw = struct.unpack("<4sHIIIII32s", header)
              assert magic == b"Z2MB", f"Invalid magic: {magic}"
              assert ver == 1, f"Unsupported version: {ver}"
              print(f"[CI Test] Binary Verified: {dev_count} devices, total size {total_sz} bytes")

              # Test probe typical device models
              test_models = ["TS0201", "TS0207", "TS0203", "TS0601", "SNZB-02P", "BASICZBR3", "lumi.sensor_motion"]
              for target in test_models:
                  target_hash = fnv1a_32(target)
                  low, high = 0, dev_count - 1
                  found = False
                  seeks = 0
                  while low <= high:
                      mid = (low + high) // 2
                      f.seek(idx_off + mid * 32)
                      seeks += 1
                      entry = f.read(32)
                      m_hash, mfg_hash, rec_start, rec_len, cat_enum, flags, exp_count = struct.unpack("<IIIIHHH", entry[:22])
                      if m_hash == target_hash:
                          found = True
                          break
                      elif m_hash < target_hash:
                          low = mid + 1
                      else:
                          high = mid - 1
                  if found:
                      print(f"[CI Test] Binary search verified: {target} resolved in {seeks} seeks.")
                  else:
                      print(f"[CI Test] Note: model {target} not in upstream subset, binary search ok.")

          # Validate manifest
          import json
          with open("dist/z2m_manifest.json", "r") as mf:
              mdata = json.load(mf)
              assert "min_firmware" in mdata, "Missing min_firmware in manifest!"
              assert "ir_version" in mdata, "Missing ir_version in manifest!"
              assert mdata["sha256"], "Missing sha256 in manifest!"
              print(f"[CI Test] Manifest schema verified: min_firmware={mdata['min_firmware']}, ir_version={mdata['ir_version']}")
          EOF

      - name: 📤 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: z2m-binary-bundle
          path: dist/*

      - name: 🚀 发布 Release 资产 (GitHub Release)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: z2m-binary-bundle-v${{ env.ZHC_VERSION }}
          name: "Z2M Binary Bundle v${{ env.ZHC_VERSION }}"
          draft: false
          prerelease: false
          files: |
            dist/z2m_bundle.bin
            dist/z2m_manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
