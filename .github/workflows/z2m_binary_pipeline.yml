name: Z2M Binary Bundle CI/CD Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save zigbee-herdsman-converters@latest

      - name: Show converter version
        run: |
          node -e "console.log('ZHC_VERSION=' + require('zigbee-herdsman-converters/package.json').version)"

      - name: Generate Z2M ESP32 IR
        run: |
          rm -rf build_ir dist
          mkdir -p build_ir dist
          node tools/z2m_bundle_generator.mjs build_ir

          if [ -d "data/converters" ]; then
            mkdir -p build_ir/converters
            cp -r data/converters/* build_ir/converters/ || true
          fi

      - name: Validate generated IR
        run: |
          test -s build_ir/z2m_bundle.ndjson
          echo "IR lines: $(wc -l < build_ir/z2m_bundle.ndjson)"
          echo "IR bytes: $(wc -c < build_ir/z2m_bundle.ndjson)"

      - name: Build binary bundle
        run: |
          python3 tools/build_z2m_binary.py build_ir dist

      - name: Verify binary bundle
        run: |
          python3 tools/verify_z2m_bundle.py dist

      - name: Generate checksums
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Read converter version
        id: version
        run: |
          VERSION=$(node -p "require('zigbee-herdsman-converters/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: z2m-esp32-bundle-${{ steps.version.outputs.version }}
          path: |
            dist/z2m_bundle.bin
            dist/z2m_manifest.json
            dist/SHA256SUMS

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: z2m-bundle-${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Z2M ESP32 Bundle ${{ steps.version.outputs.version }} #${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/z2m_bundle.bin
            dist/z2m_manifest.json
            dist/SHA256SUMS
